services:
  mongodb:
    image: mongo:7
    container_name: adote-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
      - "27018:27017"
    volumes:
      - mongodb-data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: adote-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/adote-um-amigo
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: 1d
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-5000}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@adote.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      FRONTEND_URL: http://localhost:3000
      DOG_API_KEY: ${REACT_APP_DOG_API_KEY:-}
      CAT_API_KEY: ${REACT_APP_CAT_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:4000/api
    container_name: adote-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  k6:
    image: grafana/k6:0.54.0
    container_name: adote-k6
    profiles:
      - load-test
    volumes:
      - ./load-tests/k6:/scripts:ro
    depends_on:
      - backend
    entrypoint: ["k6"]

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: adote-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.1
    container_name: adote-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mongodb-data:
  prometheus-data:
  grafana-data:
